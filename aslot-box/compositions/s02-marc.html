<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s2-night { position: absolute; inset: 0; background: #1f2a1d; }
    #s2-moon { position: absolute; left: 1640px; top: 120px; width: 70px; height: 70px; border-radius: 50%; background: #e7dac3; box-shadow: inset -18px -8px 0 #c9bfa7; }
    #s2-stage { left: 840px; top: 300px; transform-origin: 100% 0; }
    #s2-marc { left: 740px; top: 368px; width: 260px; height: 546px; }
    #s2-dot { position: absolute; left: 1539px; top: 626px; width: 36px; height: 36px; border-radius: 50%; background: #4a5c3d; box-shadow: 0 0 0 10px rgba(74, 92, 61, 0.15); }
  </style>
  <div id="root" data-composition-id="s02" data-width="1920" data-height="1080">
    <div id="s2-night"></div>
    <div id="s2-moon"></div>
    <div id="s2-ttl-host"></div>
    <div class="stage" id="s2-stage" data-layout-allow-overflow>
      <div id="s2-park-host"></div>
      <div id="s2-legend-host"></div>
    </div>
    <div id="s2-marc-host"></div>
    <div id="s2-dot"></div>
  </div>
  <script>
    (function () {
      document.getElementById("s2-ttl-host").outerHTML = AS.title("s2", "02 — Marc", "Un parc de box", "et de conteneurs.");
      document.getElementById("s2-park-host").outerHTML = AS.park("s2", { blank: true });
      document.getElementById("s2-legend-host").outerHTML = AS.legend("s2");
      AS.mount("s2-marc-host", "s2-marc", "marc");
      const tiles = AS.tileIds("s2");
      const labels = tiles.map(function (t) { return t + " .tl"; });
      // ordre d'allumage déterministe (pas d'aléatoire)
      const order = [3, 11, 0, 17, 7, 14, 20, 5, 9, 1, 19, 12, 6, 16, 2, 22, 10, 4, 18, 13, 8, 21, 15];
      const tl = gsap.timeline({ paused: true });
      tl.set("#s2-stage", { scale: 0.8 }, 0);
      // nuit
      tl.fromTo("#s2-night", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0);
      tl.fromTo("#s2-moon", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 0.3);
      tl.fromTo(tiles, { backgroundColor: "#2b3829", borderColor: "#3b4a38" }, { backgroundColor: "#2b3829", borderColor: "#3b4a38", duration: 0.01 }, 0);
      tl.fromTo(labels, { color: "#7d8a74" }, { color: "#7d8a74", duration: 0.01 }, 0);
      tl.fromTo("#s2-stage", { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.1);
      // Marc arrive
      tl.fromTo("#s2-marc", { x: -560 }, { x: 0, duration: 1.3, ease: "power2.out" }, 0.5);
      AS.walk(tl, "s2-marc", 0.5, 1.2, 0.3);
      // les box s'allument une à une
      order.forEach(function (idx, k) {
        tl.to(tiles[idx], { backgroundColor: "#f3e6c2", borderColor: "#e7dac3", duration: 0.18, ease: "power2.out" }, 0.9 + k * 0.05);
      });
      // le jour se lève
      tl.to("#s2-night", { opacity: 0, duration: 0.9, ease: "power2.inOut" }, 2.3);
      tl.to("#s2-moon", { y: -60, opacity: 0, duration: 0.7, ease: "power3.in" }, 2.2);
      tl.to(tiles, { backgroundColor: "#ffffff", borderColor: "#d8d1c1", duration: 0.6, ease: "power2.inOut" }, 2.4);
      tl.to(labels, { color: "#35422d", duration: 0.6, ease: "power2.inOut" }, 2.4);
      AS.titleIn(tl, "s2", 2.6);
      // les états apparaissent
      AS.PARK.tiles.forEach(function (t, i) {
        const st = AS.STATES[t.id];
        if (st === "free") return;
        const border = { rented: "#c4d0b7", soon: "#b4c0ca", out: "#d6b578" }[st];
        tl.to("#s2-" + t.id, { backgroundColor: AS.stateColor(st), borderColor: border, duration: 0.3, ease: "power2.out" }, 3.15 + (i % 8) * 0.05 + Math.floor(i / 8) * 0.1);
      });
      ["#s2-lg1", "#s2-lg2", "#s2-lg3", "#s2-lg4"].forEach(function (s, i) {
        tl.fromTo(s, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 3.75 + i * 0.09);
      });
      // Marc présente son parc
      AS.blink(tl, "s2-marc", 1.9);
      AS.mood(tl, "s2-marc", "big", 3.0);
      tl.to("#s2-marc-head", { rotation: 6, duration: 0.35, ease: "power2.out" }, 2.9);
      tl.to("#s2-marc-armR", { rotation: -95, duration: 0.4, ease: "back.out(1.5)" }, 2.95)
        .to("#s2-marc-armR", { rotation: 0, duration: 0.4, ease: "power2.inOut" }, 4.4);
      AS.blink(tl, "s2-marc", 4.0);
      AS.mood(tl, "s2-marc", "smile", 4.5);
      // sortie : le conteneur C4 (libre) devient un point vert
      AS.titleOut(tl, "s2", 5.1);
      tl.to("#s2-c4", { scale: 1.12, duration: 0.25, ease: "power2.out" }, 4.95);
      tl.to(tiles.filter(function (t) { return t !== "#s2-c4"; }).concat(["#s2-legend", "#s2-marc"]), { opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power2.in" }, 5.15);
      tl.to("#s2-c4", { scale: 0.05, opacity: 0, duration: 0.35, ease: "power3.in" }, 5.25);
      tl.fromTo("#s2-dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 5.45);
      tl.to("#s2-dot", { x: 1250 - 1557, y: 540 - 644, duration: 0.7, ease: "power2.inOut" }, 5.65);
      window.__timelines["s02"] = tl;
    })();
  </script>
</template>
