<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s8-c4 { opacity: 0; }
    #s8-stage { left: 840px; top: 300px; transform-origin: 100% 0; }
    #s8-marc { left: 740px; top: 368px; width: 260px; height: 546px; }
    #s8-ftile { position: absolute; left: 1488.8px; top: 605.6px; width: 137.6px; height: 76.8px; border-radius: 10px; border: 2px solid #c4d0b7; background: #dde5d3; transform-origin: 0 0; }
    .s8-h { position: absolute; top: 0; width: 210px; font-size: 36px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s08" data-width="1920" data-height="1080">
    <div id="s8-ttl-host"></div>
    <div class="stage" id="s8-stage" data-layout-allow-overflow data-layout-allow-overlap>
      <div id="s8-park-host"></div>
      <div id="s8-legend-host"></div>
      <div class="s8-h" id="s8-hS" style="left: 0">S</div>
      <div class="s8-h" id="s8-hM" style="left: 243px">M</div>
      <div class="s8-h" id="s8-hL" style="left: 486px">L</div>
      <div class="s8-h" id="s8-hC" style="left: 729px">Conteneurs</div>
    </div>
    <div id="s8-marc-host"></div>
    <div id="s8-ftile"></div>
  </div>
  <script>
    (function () {
      document.getElementById("s8-ttl-host").outerHTML = AS.title("s8", "08 — Suivi", "Tout le parc", "en un coup d'œil.");
      const st = Object.assign({}, AS.STATES, { c4: "rented" });
      document.getElementById("s8-park-host").outerHTML = AS.park("s8", { states: st });
      document.getElementById("s8-legend-host").outerHTML = AS.legend("s8");
      AS.mount("s8-marc-host", "s8-marc", "marc");
      const tl = gsap.timeline({ paused: true });
      tl.set("#s8-stage", { scale: 0.8 }, 0);
      // la tuile de l'anneau (1250,455, 260x170) rejoint sa place C4
      tl.fromTo("#s8-ftile", { x: 1250 - 1488.8, y: 455 - 605.6, scaleX: 260 / 137.6, scaleY: 170 / 76.8 }, { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.85, ease: "power3.inOut" }, 0.1);
      tl.fromTo("#s8-stage", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, 0.25);
      tl.set("#s8-c4", { opacity: 1 }, 0.95);
      tl.set("#s8-ftile", { opacity: 0 }, 0.96);
      tl.fromTo(["#s8-hS", "#s8-hM", "#s8-hL", "#s8-hC"], { opacity: 0, y: 12 }, { opacity: 0, y: 12, duration: 0.01 }, 0);
      tl.fromTo("#s8-marc", { x: -420, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.35);
      AS.titleIn(tl, "s8", 0.55);
      AS.blink(tl, "s8-marc", 1.4);
      tl.to("#s8-marc-head", { rotation: 6, duration: 0.4, ease: "power2.inOut" }, 1.2);
      // les box se rangent en colonnes par taille
      const colX = { S: 0, M: 243, L: 486, C: 729 };
      const count = { S: 0, M: 0, L: 0, C: 0 };
      tl.to("#s8-legend", { opacity: 0, duration: 0.3 }, 1.75);
      let bars = "";
      AS.PARK.tiles.forEach(function (t) {
        const k = count[t.size]++;
        bars += '<div class="tile st-' + st[t.id] + '" id="s8-b' + t.id + '" style="left:' + colX[t.size] + "px;top:" + (70 + k * 50) + 'px;width:210px;height:40px;border-radius:10px;opacity:0"><span class="tl" style="top:8px;font-size:17px">' + (t.size === "C" ? "C" : t.size) + t.id.slice(1) + "</span></div>";
      });
      document.getElementById("s8-stage").insertAdjacentHTML("beforeend", bars);
      Object.keys(count).forEach(function (k) { count[k] = 0; });
      tl.to("#s8-park .tl, #s8-park .ribs", { opacity: 0, duration: 0.25 }, 1.9);
      AS.PARK.tiles.forEach(function (t) {
        const k = count[t.size]++;
        const col = Object.keys(colX).indexOf(t.size);
        const at = 1.95 + col * 0.09 + k * 0.025;
        const dx = colX[t.size] + 105 - (t.x + t.w / 2), dy = 70 + k * 50 + 20 - (t.y + t.h / 2);
        tl.to("#s8-" + t.id, { x: dx, y: dy, scaleX: 210 / t.w, scaleY: 40 / t.h, duration: 0.75, ease: "power3.inOut" }, at);
        tl.to("#s8-" + t.id, { opacity: 0, duration: 0.12 }, at + 0.7);
        tl.fromTo("#s8-b" + t.id, { opacity: 0 }, { opacity: 1, duration: 0.12 }, at + 0.66);
      });
      tl.to(["#s8-hS", "#s8-hM", "#s8-hL", "#s8-hC"], { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.08 }, 2.75);
      AS.mood(tl, "s8-marc", "big", 3.0);
      tl.to("#s8-marc-head", { rotation: 2, duration: 0.18, ease: "power2.in" }, 3.2).to("#s8-marc-head", { rotation: 8, duration: 0.22, ease: "power2.out" }, 3.38).to("#s8-marc-head", { rotation: 5, duration: 0.25 }, 3.6);
      AS.blink(tl, "s8-marc", 4.1);
      // sortie : les colonnes se resserrent vers le centre de l'écran (elles s'ouvriront en deux écrans)
      AS.titleOut(tl, "s8", 5.15);
      tl.to("#s8-marc", { x: -360, opacity: 0, duration: 0.45, ease: "power3.in" }, 5.2);
      tl.to("#s8-stage", { x: -250, y: 80, scale: 0.35, opacity: 0, duration: 0.6, ease: "power3.in" }, 5.3);
      window.__timelines["s08"] = tl;
    })();
  </script>
</template>
