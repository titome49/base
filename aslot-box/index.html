    <style>
      :root {
        --cream: #f1efe8;
        --circle: #e9e4d8;
        --ink: #35422d;
        --olive: #4a5c3d;
        --hl: #e7dac3;
        --phone: #1f2a1d;
        --lg: #dde5d3;
        --soon: #cdd6de;
        --out: #e6c994;
        --line: #d8d1c1;
        --shadow: 0 18px 40px rgba(53, 66, 45, 0.12);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: var(--cream);
        font-family: "Montserrat", sans-serif; color: var(--ink);
      }
      #root { position: relative; width: 100%; height: 100%; background: var(--cream); }

      /* fond */
      #bg { position: absolute; inset: 0; overflow: hidden; }
      #bg .orb { position: absolute; border-radius: 50%; background: var(--circle); }

      /* titres */
      .ttl { position: absolute; left: 150px; top: 330px; width: auto; }
      .ttl-label { font-size: 26px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--olive); margin-bottom: 26px; }
      .ttl-mask { overflow: hidden; padding: 4px 6px 10px 0; margin-left: -2px; }
      .ttl-l1, .ttl-l2 { white-space: nowrap; font-size: 66px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.04; }
      .ttl-l2 { color: var(--olive); position: relative; display: inline-block; }
      .ttl-l2 span { position: relative; }
      .ttl-mark { position: absolute; left: -8px; right: -8px; bottom: 6px; height: 30px; background: var(--hl); border-radius: 6px; transform-origin: 0 50%; }

      /* parc */
      .stage { position: absolute; left: 840px; top: 260px; width: 940px; height: 560px; }
      .park { position: absolute; left: 0; top: 0; width: 940px; height: 480px; }
      .tile { position: absolute; border-radius: 14px; border: 2px solid var(--line); background: #fff; box-shadow: 0 6px 14px rgba(53, 66, 45, 0.06); overflow: hidden; }
      .tile .tl { position: absolute; left: 12px; top: 9px; font-size: 18px; font-weight: 700; color: var(--ink); opacity: 0.75; }
      .tile-C { border-radius: 10px; }
      .tile-C .ribs { position: absolute; inset: 34px 10px 10px 10px; background: repeating-linear-gradient(90deg, rgba(53, 66, 45, 0.13) 0 3px, transparent 3px 16px); border-radius: 4px; }
      .st-free { background: #fff; }
      .st-rented { background: var(--lg); border-color: #c4d0b7; }
      .st-soon { background: var(--soon); border-color: #b4c0ca; }
      .st-out { background: var(--out); border-color: #d6b578; }
      .legend { position: absolute; left: 0; top: 506px; display: flex; gap: 40px; font-size: 30px; font-weight: 600; }
      .lg { display: flex; align-items: center; gap: 10px; }
      .lg .dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; }

      /* téléphone */
      .phone { position: absolute; width: 300px; height: 620px; border-radius: 46px; background: var(--phone); padding: 12px; box-shadow: 0 30px 60px rgba(31, 42, 29, 0.25); }
      .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 36px; background: #fbfaf6; overflow: hidden; }
      .phone .notch { position: absolute; left: 50%; top: 10px; width: 86px; height: 22px; margin-left: -43px; border-radius: 12px; background: var(--phone); z-index: 5; }
      .bar { display: block; height: 12px; border-radius: 6px; background: #dcd6c8; margin: 0 0 10px 0; }

      .pill { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; font-size: 28px; font-weight: 700; background: var(--lg); color: var(--ink); white-space: nowrap; }
      .pill i { width: 12px; height: 12px; border-radius: 50%; background: var(--olive); display: inline-block; }
      .card { background: #fff; border-radius: 22px; box-shadow: var(--shadow); }
      .person { position: absolute; overflow: visible; }
      .tag { position: absolute; font-size: 22px; font-weight: 700; color: var(--ink); white-space: nowrap; }
    </style>
